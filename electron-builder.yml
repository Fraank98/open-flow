appId: com.openflow.app
productName: open-flow
copyright: Copyright © 2026 Danilo Franco

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - src/renderer/**/*
  - resources/icons/**/*
  - build/Release/*.node
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - "!**/.DS_Store"

# Native .node bundles must live outside the asar so dlopen works.
asarUnpack:
  - "build/Release/*.node"

extraResources:
  # License files, visible in Finder at Contents/Resources/licenses/.
  # electron-builder deletes Electron's own LICENSE and LICENSES.chromium.html
  # from the macOS bundle (app-builder-lib electronMac.js), so we copy them
  # back from the electron package: Electron's and Chromium's licenses require
  # that the notices ship with the binary.
  - from: node_modules/electron/dist/LICENSE
    to: licenses/LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: licenses/LICENSES.chromium.html
  - from: THIRD_PARTY_NOTICES.md
    to: licenses/THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: licenses/LICENSE.txt
  - from: resources/bin
    to: bin
    filter:
      - "whisper-server"
      - "llama-server"
      # Silero VAD model — without it whisper_full runs with VAD disabled and
      # hallucinates filler text on silence.
      - "ggml-silero-*.bin"
  # Streaming Whisper native addon ships these dylibs alongside the .node.
  # Placed at Contents/Resources/lib/ so the .node's @rpath finds them.
  - from: resources/bin/lib
    to: lib
    filter:
      - "libwhisper*.dylib"
      # ggml was split into libggml, -base, -cpu, -metal and -blas in
      # whisper.cpp v1.9.2; all of them are loaded at runtime.
      - "libggml*.dylib"
  # llama-server's own dylibs, in a directory separate from the one above.
  # llama.cpp and whisper.cpp each vendor their own ggml build, at different
  # versions but under identical filenames, with incompatible content —
  # sharing lib/ would have one silently overwrite the other's same-named
  # files. llama-server's rpath (baked in at build time, see
  # scripts/fetch-binaries.sh) looks for these at
  # Contents/Resources/lib-llama/.
  #
  # At LLAMA_TAG=b4404 this is libllama.dylib plus its private
  # libggml/-base/-cpu/-blas/-metal.dylib — no libmtmd (added to llama.cpp
  # after this tag; not produced by this build, so not listed here).
  - from: resources/bin/lib-llama
    to: lib-llama
    filter:
      - "libllama*.dylib"
      - "libggml*.dylib"

asar: true

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  icon: resources/icons/app-icon.png

dmg:
  title: "open-flow ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish: null
