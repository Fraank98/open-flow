<!doctype html><html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent}
  body{position:relative;overflow:hidden;font-family:-apple-system,system-ui,sans-serif}
  .win{position:absolute;inset:40px;border-radius:10px;overflow:hidden;background:#fff;
       box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 18px 44px rgba(0,0,0,.28)}
  .dark .win{box-shadow:0 0 0 .5px rgba(255,255,255,.14),0 18px 44px rgba(0,0,0,.28)}
  .bar{height:28px;background:#f6f6f7;display:flex;align-items:center;padding:0 12px;gap:8px;position:relative}
  .dark .bar{background:#2a2a2c}
  .bar i{width:12px;height:12px;border-radius:50%;display:block}
  .bar .t{position:absolute;left:0;right:0;text-align:center;font-size:13px;color:#6e6e73}
  .dark .bar .t{color:#a1a1a8}
  iframe{display:block;border:0}
</style></head>
<body>
<div class="win" id="win">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="t" id="title"></span></div>
  <iframe id="f"></iframe>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const w = Number(q.get("w")), h = Number(q.get("h")), theme = q.get("theme") || "light";
  if (theme === "dark") document.body.className = "dark";
  document.body.style.width = w + 80 + "px";
  document.body.style.height = h + 108 + "px";
  document.getElementById("title").textContent = q.get("title") || "";
  const f = document.getElementById("f");
  f.style.width = w + "px";
  f.style.height = h + "px";
  f.src = `${q.get("page")}?theme=${theme}&${q.get("q") || ""}`;
</script>
</body></html>
