</style></head><body><h2>Your recording pill</h2><p>Three styles. Choose yours in Settings.</p><section><h3>Compact</h3><iframe data-style="compact"></iframe></section><section class="preview"><h3>Preview</h3><iframe data-style="preview"></iframe></section><section><h3>Minimal</h3><iframe data-style="minimal"></iframe></section><script>const theme=new URLSearchParams(location.search).get('theme')||'light';document.body.className=theme;document.documentElement.style.colorScheme=theme;document.querySelectorAll('iframe').forEach(f=>f.src='overlay.html?theme='+theme+'&style='+f.dataset.style);</script></body></html>
