<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="./lib/recording-pill.css" />
    <link rel="stylesheet" href="./overlay.css" />
    <title>open-flow</title>
  </head>
  <body>
    <div id="root" class="state-idle" data-pill-style="compact" data-dictation-layout="true">
      <div id="pill" class="recording-pill">
        <div class="pill-row">
          <div class="dot"></div>
          <div class="content"><div class="label" id="label" role="status">Idle</div></div>
          <div class="waveform" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <span class="elapsed" id="elapsed" aria-label="Recording duration">00:00</span>
          <button id="cancel" type="button" aria-label="Cancel dictation">✕</button>
        </div>
        <div class="partial" id="partial"></div>
        <div class="pill-hint" id="pill-hint"></div>
      </div>
      <div id="suggest">
        <div class="gist" id="gist"></div>
        <div class="variants" id="variants"></div>
        <div class="hint">Esc per chiudere</div>
      </div>
    </div>
    <script>
      const labelEl = document.getElementById("label");
      const partialEl = document.getElementById("partial");
      const rootEl = document.getElementById("root");
      const cancelBtn = document.getElementById("cancel");
      const gistEl = document.getElementById("gist");
      const variantsEl = document.getElementById("variants");

      const TEXT = {
        idle: "",
        recording: "Recording…",
        transcribing: "Transcribing…",
        cleaning: "Cleaning…",
        injecting: "Pasting…",
        error: "Error",
        reading: "Reading the conversation…",
        thinking: "Drafting replies…",
        nothing: "No suggestion",
        suggesting: "",
        flash: "",
        "paste-failed": "Paste failed — text in clipboard",
        "copy-failed": "Couldn't paste or copy — try again",
      };
      const BADGES = ["⌘1", "⌘2", "⌘3"];
      let suggesting = false;
      let currentState = "idle";
      let recordingStarted = 0;
      let timer = null;
      let meterReset = null;
      const elapsedEl = document.getElementById("elapsed");
      const bars = [...document.querySelectorAll(".waveform i")];
      const levels = Array(9).fill(0);
      function updateElapsed() {
        const seconds = Math.max(0, Math.floor((performance.now() - recordingStarted) / 1000));
        elapsedEl.textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
      }
      function renderMeter() {
        bars.forEach((bar, i) => { bar.style.height = `${3 + levels[i] * 17}px`; });
      }
      window.openFlowOverlay.onAppearance(({ style, shortcutLabel }) => {
        rootEl.dataset.pillStyle = ["compact", "preview", "minimal"].includes(style) ? style : "compact";
        document.getElementById("pill-hint").textContent = `Release ${shortcutLabel} to finish`;
      });
      window.openFlowOverlay.onLevel((level) => {
        if (currentState !== "recording") return;
        levels.shift();
        levels.push(Number.isFinite(level) ? Math.max(0, Math.min(1, level)) : 0);
        renderMeter();
        clearTimeout(meterReset);
        meterReset = setTimeout(() => { levels.fill(0); renderMeter(); }, 600);
      });

      function clearSuggestions() {
        suggesting = false;
        gistEl.textContent = "";
        variantsEl.replaceChildren();
      }

      window.openFlowOverlay.onState((state) => {
        if (state !== "suggesting") clearSuggestions();
        const previous = currentState;
        currentState = state;
        rootEl.className = `state-${state}`;
        rootEl.dataset.dictationLayout = String(["idle", "recording", "transcribing", "cleaning", "injecting"].includes(state));
        cancelBtn.setAttribute("aria-label", state === "suggesting" ? "Dismiss suggestions" : "Cancel dictation");
        if (state === "recording" && previous !== "recording") {
          partialEl.textContent = "";
          recordingStarted = performance.now();
          updateElapsed();
          clearInterval(timer);
          timer = setInterval(updateElapsed, 250);
        } else if (state !== "recording") {
          clearInterval(timer);
          clearTimeout(meterReset);
          levels.fill(0);
          renderMeter();
        }
        // flash owns the label itself (onFlash sets it); every other state
        // falls back to the fixed TEXT table.
        if (state !== "flash") labelEl.textContent = TEXT[state] ?? state;
        if (state === "idle" || state === "recording") {
          // Idle clears the preview; entering a new recording starts fresh.
          if (state === "idle") partialEl.textContent = "";
        }
      });

      window.openFlowOverlay.onPartial((text) => {
        // Show the latest streaming-whisper transcript as it accumulates.
        if (currentState === "recording") partialEl.textContent = text;
      });

      window.openFlowOverlay.onSuggestions((payload) => {
        // The sender is main only, so a malformed payload is unlikely, but a
        // half-built panel (gist written, no rows) is bad enough to guard
        // against cheaply: bail out to a clean, empty state instead.
        if (!payload || !Array.isArray(payload.variants)) {
          clearSuggestions();
          return;
        }
        suggesting = true;
        gistEl.textContent = payload.gist ?? "";
        const rows = payload.variants.map((v) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "variant";
          row.title = v.text; // full text on hover
          const badge = document.createElement("span");
          badge.className = "badge";
          // Derived from the variant's OWN id (the same 1/2/3 the payload
          // already carries and Command+N/accept() key off), not its array
          // position — the array index happened to always agree with id
          // today, but the two are conceptually the accelerator contract's
          // ONE source of truth and a second copy of it, respectively
          // (found by review, Minor 8.3).
          badge.textContent = BADGES[v.id - 1] ?? "";
          const label = document.createElement("span");
          label.className = "vlabel";
          label.textContent = v.label;
          const text = document.createElement("span");
          text.className = "vtext";
          text.textContent = v.text; // text only, never parsed as markup
          row.append(badge, label, text);
          row.addEventListener("click", () => window.openFlowOverlay.choose(v.id));
          return row;
        });
        variantsEl.replaceChildren(...rows);
      });

      window.openFlowOverlay.onFlash((text) => {
        labelEl.textContent = text;
      });

      // The ✕ dismisses the suggestions when they are up, and cancels the
      // dictation pipeline otherwise.
      cancelBtn.addEventListener("click", () => {
        if (suggesting) window.openFlowOverlay.dismiss();
        else window.openFlowOverlay.cancel();
      });

      // Hovering the pill resets the 20 s auto-close timer (spec §7).
      rootEl.addEventListener("mouseenter", () => {
        if (suggesting) window.openFlowOverlay.hover();
      });
    </script>
  </body>
</html>
